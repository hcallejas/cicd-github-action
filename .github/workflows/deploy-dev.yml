
name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Generar configuración Maven
      - name: Configure Maven settings
        env:
          CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${CLIENT_ID}~?~${CLIENT_SECRET}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 4. Publicar en Anypoint Exchange
      - name: Publish to Exchange
        run: |
          mvn -B clean deploy \
            -DskipMunitTests

      # 5. Desplegar en CloudHub 2.0
      - name: Deploy to CloudHub 2.0
        env:
          CONNECTED_APP_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
          ANYPOINT_BUSINESS_GROUP_ID: ${{ secrets.ANYPOINT_BUSINESS_GROUP_ID }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
          ANYPOINT_ENVIRONMENT: DEV
          NUM_REPLICAS: 1
          NUM_VCORES: 0.1
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          pom = Path("pom.xml")
          content = pom.read_text(encoding="utf-8")

          group_id = os.environ["ANYPOINT_BUSINESS_GROUP_ID"].strip()

          if not group_id:
              raise SystemExit("ERROR: ANYPOINT_BUSINESS_GROUP_ID está vacío")

          placeholder = "__ANYPOINT_BUSINESS_GROUP_ID__"

          if placeholder not in content:
              raise SystemExit("ERROR: No se encontró el marcador en pom.xml")

          content = content.replace(placeholder, group_id)

          pom.write_text(content, encoding="utf-8")

          if placeholder in pom.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: El reemplazo no se realizó")

          print("GroupId reemplazado correctamente")
          PY

          mvn -B mule:deploy
          
